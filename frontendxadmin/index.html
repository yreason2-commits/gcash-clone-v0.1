<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GCash Clone Dashboard</title>
    
    <!-- Meta tags for admin dashboard -->
    <meta name="description" content="GCash Clone Administrative Dashboard - Registration Monitoring & Management" />
    <meta name="robots" content="noindex, nofollow" />
    
    <!-- Preconnect to API for faster loading -->
    <link rel="preconnect" href="https://gcash-clone-v0-1.onrender.com" />
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Admin Dashboard Styles -->
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #1C72F9 0%, #0b3a8f 100%);
        min-height: 100vh;
      }
      
      #app {
        min-height: 100vh;
      }
      
      /* Loading state */
      .loading-splash {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #1C72F9 0%, #0b3a8f 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
      }
      
      .loading-content {
        text-align: center;
        color: white;
      }
      
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 1rem;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- Loading splash screen -->
      <div class="loading-splash" id="loading-splash">
        <div class="loading-content">
          <div class="spinner"></div>
          <h2>🔐 GCash Clone Dashboard</h2>
          <p>Loading Registration Monitor...</p>
        </div>
      </div>
    </div>
    
    <script type="module" src="/src/main.js"></script>
    
    <!-- Hide loading splash after app loads -->
    <script>
      window.addEventListener('load', function() {
        setTimeout(() => {
          const splash = document.getElementById('loading-splash');
          if (splash) {
            splash.style.opacity = '0';
            splash.style.transition = 'opacity 0.5s ease-out';
            setTimeout(() => {
              splash.style.display = 'none';
            }, 500);
          }
        }, 500);
      });
    </script>
  </body>
</html>
